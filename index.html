<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car WebGL</title>
    
    <!-- مكتبة Three.js الأساسية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة تحميل ملفات .glb -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- مكتبة للتحكم بالكاميرا بالماوس (OrbitControls) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; color: #fff; font-family: 'Manrope', sans-serif; overflow: hidden; }
        
        #webgl-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }

        /* شاشة التحميل (مهمة جداً للمجسمات 3D) */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* واجهة المستخدم تجي فوق الـ 3D */
        .ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px; pointer-events: none;
        }
        header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .logo { font-family: 'Syncopate', sans-serif; font-size: 1.5rem; letter-spacing: 2px; }
        .hero-text { text-align: left; pointer-events: auto; }
        h1 { font-family: 'Syncopate', sans-serif; font-size: clamp(2rem, 5vw, 4rem); text-transform: uppercase; margin-bottom: 15px; }
        p { color: #aaa; max-width: 400px; line-height: 1.6; margin-bottom: 20px; }
        button { background: #fff; color: #000; border: none; padding: 15px 35px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loading-text">جاري تحميل السيارة (0%)</p>
    </div>

    <!-- الكانفاس لي يترسم فيه 3D -->
    <canvas id="webgl-canvas"></canvas>

    <!-- الواجهة -->
    <div class="ui-layer">
        <header><div class="logo">GARAGE 3D</div></header>
        <div class="hero-text">
            <h1>Experience<br>The Drive</h1>
            <p>يمكنك تحريك السيارة بإصبعك (الدوران والتكبير). التصيير يتم بالكامل عبر أكواد الجافاسكريبت.</p>
            <button>Book Now</button>
        </div>
    </div>

    <script>
        // 1. إعداد المشهد، الكاميرا والريندر
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8); // الكاميرا بعيدة شوية باش تبان الطوموبيل

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 2. التحكم بالكاميرا (باش المستخدِم يدور الطوموبيل بصبعو)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // حركة سلسة
        controls.autoRotate = true; // دور وحدها ببطء
        controls.autoRotateSpeed = 1.0;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // باش ما يهبطش تحت الأرض

        // 3. الإضاءة (طوموبيلات يحتاجو ضوء مليح باش يبان الحديد)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        
        const backLight = new THREE.DirectionalLight(0xffffff, 1);
        backLight.position.set(-5, 5, -7);
        scene.add(backLight);

        // 4. تحميل ملف السيارة (.glb)
        const loader = new THREE.GLTFLoader();
        let carModel;

        // غير هذا الرابط بمسار الملف تاعك مثلاً: 'car.glb'
        // هنا راني داير رابط تجريبي (خوذة) باش الكود يخدم مباشرة كي تستي
        const modelUrl = 'car.glb'; 

        loader.load(
            modelUrl,
            function (gltf) {
                carModel = gltf.scene;
                
                // ⚠️ مهم: المجسمات من النت أحجامها تختلف. إذا بانتلك كبيرة بزاف صغرها هنا
                carModel.scale.set(2, 2, 2); 
                // نزلها شوية لتحت
                carModel.position.y = -1; 
                
                scene.add(carModel);

                // إخفاء شاشة التحميل بعد ما يكمل
                const loaderDiv = document.getElementById('loader');
                loaderDiv.style.opacity = '0';
                setTimeout(() => loaderDiv.style.display = 'none', 500);
            },
            // متابعة نسبة التحميل
            function (xhr) {
                const percent = (xhr.loaded / xhr.total * 100);
                if(percent !== Infinity) {
                    document.getElementById('loading-text').innerText = `جاري تحميل السيارة (${Math.round(percent)}%)`;
                }
            },
            function (error) {
                console.error('An error happened:', error);
                document.getElementById('loading-text').innerText = 'حدث خطأ أثناء التحميل!';
            }
        );

        // 5. حلقة الأنيميشن (Render Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // لازم تتحدث باش الدوران يخدم
            renderer.render(scene, camera);
        }
        animate();

        // 6. استجابة تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
